services:
  - type: web
    name: carolina-edge-library-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: carolina-edge-library-db
          property: connectionString
      - key: WRITE_API_KEY
        generateValue: true

databases:
  - name: carolina-edge-library-db
    plan: free
    databaseName: carolina_edge_library
    user: carolina_edge_library
